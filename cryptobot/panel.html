<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptobot Panel</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #17191c; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --good: #15803d; --bad: #b91c1c; --warn: #b45309; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #9aa3af; --border: #262b35;
      --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; --chip: #222733;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .card { min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; font-weight: 600; }
  .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .chip.real { background: var(--bad); color: #fff; }
  .chip.demo { background: var(--accent); color: #fff; }
  .chip.paused { background: var(--warn); color: #111; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--chip); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 16px 0; }
  .tile { background: var(--chip); border-radius: 8px; padding: 8px 12px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .error { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); padding: 8px 12px; border-radius: 8px; margin-top: 12px; word-break: break-word; }
  .chart { height: 200px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .chart .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
  .chart .axis { font-size: 11px; fill: var(--muted); }
  .chart .grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .chart-head { display: flex; justify-content: space-between; margin-top: 16px; font-size: 12px; }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  .empty { text-align: center; padding: 48px 16px; }
  code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>Cryptobot</h1>
  <span class="muted" id="updated"></span>
</header>
<main id="bots"></main>

<script>
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 2) => (v === null || v === undefined || v === "" || isNaN(v)) ? "—" : Number(v).toLocaleString("ru-RU", { minimumFractionDigits: d, maximumFractionDigits: d });
const time = (iso) => iso ? new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const ACTIONS = { open: "Вход", close: "Выход", hold: "Ждём" };
const REASONS = {
  "EMA cross up": "EMA пересекла вверх", "EMA cross down": "EMA пересекла вниз", "no signal": "нет сигнала",
  "in position": "в позиции", "position size below $1": "позиция меньше $1", "stop would be below zero": "стоп ниже нуля",
  "stale TP/SL without a position": "чистка старых стопов", "paused from the panel; not opening new positions": "пауза — новые входы отключены",
  "short position not opened by this bot; leaving it alone": "ручной шорт — бот не трогает",
};
const ru = (r) => REASONS[r] || r;

function card(bot) {
  const s = bot.status, c = s.config || {}, st = s.state || {}, pos = st.position;
  const real = c.env === "prod";
  const tpsl = st.tpsl || [];
  const stop = tpsl.find((t) => t.type === "stop-loss"), tp = tpsl.find((t) => t.type === "take-profit");
  const pnl = pos ? Number(pos.unRealizedPnL || 0) : null;
  const trades = [...bot.trades].reverse().map((t) => `
    <tr><td>${esc(time(t.time))}</td><td>${esc(ACTIONS[t.action] || t.action)}</td><td>${esc(ru(t.reason))}</td>
    <td>${num(t.mark)}</td><td>${t.action === "open" ? "$" + num(t.cash) : ""}</td><td>${t.action === "open" ? num(t.stop) : ""}</td></tr>`).join("");
  return `
  <section class="card" id="bot-${esc(bot.name)}">
    <div class="top">
      <div class="title">
        <span><span class="dot" style="background:${s.alive ? "var(--good)" : "var(--bad)"}"></span>${esc(c.instrument)}</span>
        <span class="chip ${real ? "real" : "demo"}">${real ? "РЕАЛЬНЫЙ СЧЁТ" : "ДЕМО"}</span>
        <span class="chip">${esc(c.timeframe)} · ${esc(c.signal)}</span>
        ${s.paused ? '<span class="chip paused">ПАУЗА</span>' : ""}
        ${s.alive ? "" : '<span class="chip">бот не отвечает</span>'}
      </div>
      <div class="buttons">
        ${s.paused
          ? `<button onclick="act('${esc(bot.name)}','resume')">▶ Продолжить</button>`
          : `<button onclick="act('${esc(bot.name)}','pause')">⏸ Пауза</button>`}
        <button class="danger" ${pos ? "" : "disabled"} onclick="closePos('${esc(bot.name)}', ${real})">Закрыть позицию</button>
      </div>
    </div>
    ${s.error ? `<div class="error">Ошибка: ${esc(s.error)}</div>` : ""}
    <div class="tiles">
      <div class="tile"><div class="label">Доступный баланс</div><div class="value">$${num(st.availableBalance)}</div></div>
      <div class="tile"><div class="label">Позиция</div><div class="value">${pos ? `${pos.side === "BUY" ? "Лонг" : "Шорт"} ${num(pos.quantity, 4)}` : "нет"}</div></div>
      <div class="tile"><div class="label">Цена входа</div><div class="value">${pos ? num(pos.avgPrice) : "—"}</div></div>
      <div class="tile"><div class="label">Нереализ. PnL</div><div class="value ${pnl > 0 ? "good" : pnl < 0 ? "bad" : ""}">${pos ? "$" + num(pnl) : "—"}</div></div>
      <div class="tile"><div class="label">Стоп / Тейк</div><div class="value">${stop ? num(stop.price, 0) : "—"} / ${tp ? num(tp.price, 0) : "—"}</div></div>
      <div class="tile"><div class="label">Цена (mark)</div><div class="value">${num(st.markPrice)}</div></div>
      <div class="tile"><div class="label">EMA ${esc(c.fast_ema)} / ${esc(c.slow_ema)}</div><div class="value ${s.ema_fast > s.ema_slow ? "good" : "bad"}">${s.ema_fast > s.ema_slow ? "↑ тренд" : "↓ тренд"}</div></div>
      <div class="tile"><div class="label">RSI</div><div class="value">${num(s.rsi, 1)}</div></div>
    </div>
    <div class="muted">Последняя свеча ${esc(time(s.candle))}: <b>${esc(ACTIONS[s.action] || "—")}</b> — ${esc(ru(s.reason) || "ещё не было свечей")}</div>
    <div class="chart-head muted"><span>Баланс + нереализованный PnL, $</span><span>${chartRange(bot.equity)}</span></div>
    <div class="chart">${chart(bot.equity)}</div>
    <div class="table-wrap">
      <table><thead><tr><th>Время</th><th>Действие</th><th>Причина</th><th>Цена</th><th>Сумма</th><th>Стоп</th></tr></thead>
      <tbody>${trades || '<tr><td colspan="6" class="muted">Сделок пока нет</td></tr>'}</tbody></table>
    </div>
    <details><summary>Настройки бота</summary>
      <div class="muted" style="margin-top:8px">Плечо ${esc(c.leverage)}x · максимум $${esc(c.max_usd)} на позицию · риск ${num((c.risk_per_trade || 0) * 100, 1)}% на сделку · стоп ${esc(c.stop_atr)}×ATR · тейк ${esc(c.take_profit_atr)}×ATR</div>
    </details>
  </section>`;
}

const equityOf = (e) => Number(e.balance) + Number(e.unrealized_pnl || 0);

function chartRange(equity) {
  if (equity.length < 2) return "";
  const first = equityOf(equity[0]), last = equityOf(equity.at(-1)), pct = (last / first - 1) * 100;
  return `<span class="${pct >= 0 ? "good" : "bad"}">${pct >= 0 ? "+" : ""}${num(pct)}%</span> с ${esc(time(equity[0].time))}`;
}

function chart(equity) {
  if (equity.length < 2) return '<div class="muted" style="padding-top:80px;text-align:center">График появится после второй свечи</div>';
  const ys = equity.map(equityOf), min = Math.min(...ys), max = Math.max(...ys), pad = (max - min) * 0.1 || 1;
  const lo = min - pad, hi = max + pad, W = 1000, H = 200;
  const x = (i) => (i / (ys.length - 1)) * W, y = (v) => H - ((v - lo) / (hi - lo)) * H;
  const pts = ys.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const grid = [0.25, 0.5, 0.75].map((f) => `<line class="grid" x1="0" x2="${W}" y1="${H * f}" y2="${H * f}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="График баланса">
    ${grid}<polygon class="area" points="0,${H} ${pts} ${W},${H}"/><polyline class="line" points="${pts}"/></svg>
    <div class="axis muted" style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(time(equity[0].time))}</span><span>мин $${num(min)} · макс $${num(max)}</span><span>${esc(time(equity.at(-1).time))}</span></div>`;
}

async function refresh() {
  try {
    const res = await fetch("/api/bots");
    if (!res.ok) throw new Error(res.status);
    const bots = await res.json();
    const root = document.getElementById("bots");
    if (!bots.length) {
      root.innerHTML = `<div class="card empty"><b>Ботов пока нет</b><p class="muted">Запустите бота: <code>python -m cryptobot.main evedex --instrument BTCUSDT:DEMO</code><br>Он появится здесь через минуту.</p></div>`;
    } else {
      root.innerHTML = bots.map(card).join("");
    }
    document.getElementById("updated").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU");
  } catch (e) {
    document.getElementById("updated").textContent = "нет связи с панелью";
  }
}

async function act(name, action) {
  const res = await fetch(`/api/bots/${encodeURIComponent(name)}/${action}`, { method: "POST" });
  if (!res.ok) alert("Ошибка: " + (await res.json()).detail);
  refresh();
}

function closePos(name, real) {
  const msg = real
    ? "РЕАЛЬНЫЙ СЧЁТ. Закрыть позицию по рынку и поставить бота на паузу?"
    : "Закрыть позицию по рынку и поставить бота на паузу?";
  if (confirm(msg)) act(name, "close");
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
