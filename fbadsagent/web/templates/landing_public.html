<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    line-height: 1.5;
  }
  .hero {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    padding: 72px 24px;
    text-align: center;
  }
  .hero h1 { font-size: 2.2rem; margin: 0 0 12px; }
  .hero p.sub { font-size: 1.1rem; opacity: 0.85; max-width: 600px; margin: 0 auto; }
  .benefits {
    max-width: 900px;
    margin: 48px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }
  .benefit-card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }
  .form-section {
    background: #f7f7f9;
    padding: 56px 24px;
  }
  .form-card {
    max-width: 420px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .form-card h2 { margin: 0 0 20px; font-size: 1.3rem; text-align: center; }
  label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #ff6b35;
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover { background: #e85a2a; }
  button:disabled { background: #ccc; cursor: default; }
  .msg { margin-top: 16px; text-align: center; font-size: 0.9rem; }
  .msg.success { color: #2b8a3e; }
  .msg.error { color: #c92a2a; }
</style>
</head>
<body>
  <section class="hero">
    <h1>{{ page.headline }}</h1>
    <p class="sub">{{ page.subheadline }}</p>
  </section>

  {% if page.benefits %}
  <section class="benefits">
    {% for benefit in page.benefits %}
    <div class="benefit-card"><p>{{ benefit }}</p></div>
    {% endfor %}
  </section>
  {% endif %}

  <section class="form-section">
    <div class="form-card">
      <h2>{{ page.cta_text }}</h2>
      <form id="lead-form">
        <label for="fio">Full name</label>
        <input id="fio" name="fio" type="text" required>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" required>
        <button type="submit" id="submit-btn">{{ page.cta_text }}</button>
        <div class="msg" id="form-msg"></div>
      </form>
    </div>
  </section>

  <script>
    const form = document.getElementById('lead-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('form-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = '';
      msg.className = 'msg';

      try {
        const res = await fetch(window.location.pathname + '/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fio: document.getElementById('fio').value,
            phone: document.getElementById('phone').value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          msg.textContent = 'Thanks! We will contact you shortly.';
          msg.className = 'msg success';
          form.reset();
        } else {
          msg.textContent = data.error || 'Something went wrong. Please try again.';
          msg.className = 'msg error';
        }
      } catch (err) {
        msg.textContent = 'Network error. Please try again.';
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
