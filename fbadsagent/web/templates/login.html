<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Ads Agent Dashboard</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1420;
    color: #e8eaf0;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #171d2b;
    border: 1px solid #262e42;
    border-radius: 14px;
    padding: 32px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 24px; text-align: center; }
  label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #a3adc2; }
  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 18px;
    border-radius: 8px;
    border: 1px solid #2c3550;
    background: #10141f;
    color: #e8eaf0;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4c6ef5;
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #3f5cdb; }
  .error {
    background: #3a1a1a;
    border: 1px solid #6b2b2b;
    color: #ff9b9b;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Ads Agent Dashboard</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
