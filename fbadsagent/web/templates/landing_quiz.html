<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>{{ page.title }}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    background: #f4f5f7;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .top {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    padding: 20px 20px 14px;
    text-align: center;
  }
  .top h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .top p { margin: 0; opacity: 0.8; font-size: 0.9rem; }
  .progress-track {
    height: 5px;
    background: #232a3d;
  }
  .progress-fill {
    height: 100%;
    background: #ff6b35;
    width: 0%;
    transition: width 0.3s ease;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 460px;
    width: 100%;
    padding: 32px 26px;
    text-align: center;
  }
  .card h2 { font-size: 1.2rem; margin: 0 0 22px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    padding: 14px 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fafafa;
    font-size: 1rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .option-btn:hover { background: #fff0ea; border-color: #ff6b35; }
  .analyzing { color: #666; font-size: 0.95rem; padding: 20px 0; }
  .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff6b35;
    margin: 0 2px;
    animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  .result-message { font-size: 1rem; color: #333; margin-bottom: 24px; text-align: left; white-space: pre-wrap; }
  label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; text-align: left; }
  input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 1rem;
  }
  button.submit {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #ff6b35;
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button.submit:hover { background: #e85a2a; }
  button.submit:disabled { background: #ccc; cursor: default; }
  .msg { margin-top: 16px; text-align: center; font-size: 0.9rem; }
  .msg.success { color: #2b8a3e; }
  .msg.error { color: #c92a2a; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="top">
    <h1>{{ page.headline }}</h1>
    <p>{{ page.subheadline }}</p>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <main>
    <div class="card">
      <div id="question-view">
        <h2 id="question-text"></h2>
        <div class="options" id="question-options"></div>
      </div>

      <div id="analyzing-view" class="hidden">
        <p class="analyzing">Analyzing your answers<span class="dots"><span></span><span></span><span></span></span></p>
      </div>

      <div id="result-view" class="hidden">
        <div class="result-message">{{ page.quiz_result_message }}</div>
        <form id="lead-form">
          <label for="fio">Full name</label>
          <input id="fio" name="fio" type="text" required>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" required>
          <button type="submit" class="submit" id="submit-btn">{{ page.cta_text }}</button>
          <div class="msg" id="form-msg"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const questions = {{ quiz_questions_json | tojson }};
    const questionView = document.getElementById('question-view');
    const analyzingView = document.getElementById('analyzing-view');
    const resultView = document.getElementById('result-view');
    const questionText = document.getElementById('question-text');
    const questionOptions = document.getElementById('question-options');
    const progressFill = document.getElementById('progress-fill');

    let step = 0;

    function renderQuestion() {
      const q = questions[step];
      questionText.textContent = q.text;
      questionOptions.innerHTML = '';
      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.type = 'button';
        btn.textContent = opt;
        btn.addEventListener('click', nextStep);
        questionOptions.appendChild(btn);
      });
      progressFill.style.width = Math.round((step / questions.length) * 100) + '%';
    }

    function nextStep() {
      step += 1;
      if (step < questions.length) {
        renderQuestion();
        return;
      }
      progressFill.style.width = '100%';
      questionView.classList.add('hidden');
      analyzingView.classList.remove('hidden');
      setTimeout(() => {
        analyzingView.classList.add('hidden');
        resultView.classList.remove('hidden');
      }, 1400);
    }

    if (questions.length > 0) {
      renderQuestion();
    } else {
      nextStep();
    }

    const form = document.getElementById('lead-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('form-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = '';
      msg.className = 'msg';

      try {
        const res = await fetch(window.location.pathname + '/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fio: document.getElementById('fio').value,
            phone: document.getElementById('phone').value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          msg.textContent = 'Thanks! We will contact you shortly.';
          msg.className = 'msg success';
          form.reset();
        } else {
          msg.textContent = data.error || 'Something went wrong. Please try again.';
          msg.className = 'msg error';
        }
      } catch (err) {
        msg.textContent = 'Network error. Please try again.';
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
