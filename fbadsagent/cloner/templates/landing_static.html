<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>{{ project.name }}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    line-height: 1.5;
  }
  .hero {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    padding: 72px 24px;
    text-align: center;
  }
  .hero h1 { font-size: 2.2rem; margin: 0 0 12px; }
  .hero p.sub { font-size: 1.1rem; opacity: 0.85; max-width: 600px; margin: 0 auto; }
  .benefits {
    max-width: 900px;
    margin: 48px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }
  .benefit-card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }
  .cta-section {
    background: #f7f7f9;
    padding: 56px 24px;
    text-align: center;
  }
  .cta-btn {
    display: inline-block;
    padding: 16px 40px;
    border-radius: 8px;
    background: #ff6b35;
    color: #fff;
    font-weight: 600;
    font-size: 1.1rem;
    text-decoration: none;
  }
  .cta-btn:hover { background: #e85a2a; }
</style>
</head>
<body>
  <section class="hero">
    <h1>{{ project.headline }}</h1>
    <p class="sub">{{ project.subheadline }}</p>
  </section>

  {% if project.benefits %}
  <section class="benefits">
    {% for benefit in project.benefits %}
    <div class="benefit-card"><p>{{ benefit }}</p></div>
    {% endfor %}
  </section>
  {% endif %}

  <section class="cta-section">
    <a class="cta-btn" href="{{ project.checkout_url or '#' }}">{{ project.cta_text }}</a>
  </section>
</body>
</html>
