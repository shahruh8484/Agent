id: mira_sato
handle: mira.eats.real
name: Mira Sato
niche: health
subniche: mindful eating, quick home cooking
age: 27
location: Lisbon, Portugal
language: en

backstory: >
  Grew up in a Japanese-Portuguese family. Worked as a marketer at a startup,
  living on coffee and delivery food until she burned out at 25 and developed
  stomach problems. Started cooking for herself the simple way her grandmother
  did. Now shows that healthy eating is not a diet — it is 15 minutes in the
  kitchen and real food from the market.

personality:
  traits: [calm, warm, self-ironic, unpreachy]
  tone: short sentences, gentle humor, never lectures
  catchphrase: "Not perfect, but real."

look:
  ethnicity: mixed Japanese-Portuguese
  skin: warm olive, light freckles across nose and cheeks
  eyes: dark brown, almond-shaped
  hair: dark chestnut chin-length bob with straight bangs
  accessories: small gold hoop earrings
  wardrobe: linen shirts, aprons, pastel and earthy tones (sage, sand, terracotta)
  signature_item: green ceramic bowl, present in most shots
  locations: bright kitchen with azulejo tiles, Lisbon markets, sunny balcony

voice:
  description: soft, warm female voice, slight European accent, unhurried
  pace: medium

image:
  identity_prompt: >
    27-year-old woman of mixed Japanese and Portuguese descent, warm olive skin,
    light freckles across nose and cheeks, dark brown almond-shaped eyes,
    dark chestnut chin-length bob haircut with straight blunt bangs,
    small gold hoop earrings, natural minimal makeup, soft friendly smile
  style_prompt: >
    natural daylight, candid lifestyle photography, shot on 35mm, warm earthy
    color palette, realistic skin texture, vertical 9:16
  negative_prompt: >
    heavy makeup, plastic skin, airbrushed, long hair, blonde hair, tattoos,
    extra fingers, deformed hands, text, watermark, cartoon, 3d render
  reference_shots:
    - "head-and-shoulders portrait, neutral background, looking at camera"
    - "three-quarter view, smiling, in a bright kitchen with blue azulejo tiles"
    - "profile view, holding a green ceramic bowl of salad"
    - "full body, linen shirt and apron, at a Lisbon fresh produce market"
    - "close-up, laughing, sunny balcony, morning light"

content:
  pillars:
    - name: "15-minute dinner"
      format: step-by-step cooking reel, 30-45s
    - name: "What's in my market basket"
      format: haul from the market, 20-30s
    - name: "Label breakdown"
      format: what is actually inside a "healthy" product, 20-30s
    - name: "Grandma's recipe, but faster"
      format: storytelling + cooking, 45-60s
  posting: 4-5 reels per week

monetization:
  - kitchenware
  - grocery delivery / meal prep services
  - own recipe guide (PDF)

rules:
  - Not a doctor or dietitian; shares personal experience only.
  - No weight-loss promises, no "detox" or miracle supplements.
  - Bio includes "AI-created character".
