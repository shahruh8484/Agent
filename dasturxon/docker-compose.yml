# Локальный/staging запуск всей платформы: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dx}
      POSTGRES_DB: dasturxon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dx -d dasturxon"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://dx:${DB_PASSWORD:-dx}@db:5432/dasturxon
      PORT: 4000
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
