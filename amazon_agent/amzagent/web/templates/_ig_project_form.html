<form method="post" action="{% if p %}/admin/ig/projects/{{ p.id }}{% else %}/admin/ig/projects{% endif %}" style="display:grid;gap:10px;margin-top:10px">
  <div class="set-grid">
    <label>Название<input name="name" required maxlength="80" value="{{ p.name if p else '' }}" placeholder="Бразилия — ставки, бренд X"></label>
    <label>Бренд оператора<input name="brand" maxlength="80" value="{{ p.brand if p else '' }}" placeholder="Название букмекера"></label>
    <label>Сайт оператора (лицензия)<input name="license_url" value="{{ p.license_url if p else '' }}" placeholder="https://brand.bet.br/"></label>
    <label>Ссылка оффера из партнёрки<input name="offer_url" required value="{{ p.offer_url if p else '' }}" placeholder="https://partner.example/?aff=1&sub1={click_id}"><span class="muted">вместо своей метки подставьте <code>{click_id}</code>; можно также <code>{campaign}</code> и <code>{zone}</code></span></label>
    <label>Выплата за депозит (CPA), $<input name="payout" type="number" step="0.01" min="0" value="{{ '%.2f'|format(p.payout) if p else '0.00' }}"><span class="muted">если партнёрка не пришлёт сумму в постбэке</span></label>
    <label>Домен лендинга<input name="domain" value="{{ p.domain if p else '' }}" placeholder="apostas-exemplo.com"><span class="muted">отдельный, не {{ main_domain or "домен Amazon-сайта" }}</span></label>
    <label>Страна<select name="country">{% for code, name in countries.items() %}<option value="{{ code }}"{% if (p.country if p else 'BR') == code %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>
    <label>Язык лендинга<select name="language">{% for code, name in languages.items() %}<option value="{{ code }}"{% if (p.language if p else 'pt') == code %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>
  </div>
  <label style="display:grid;gap:4px;font-weight:600">Оффер<textarea name="offer" rows="4" maxlength="3000" style="width:100%;box-sizing:border-box" placeholder="Бонус и его условия (вейджер), минимальный депозит, способы оплаты (PIX), какие виды спорта — только то, что написано в условиях партнёрки">{{ p.offer if p else '' }}</textarea></label>
  <div><button class="primary">{{ "Сохранить проект" if p else "Создать проект" }}</button></div>
</form>
