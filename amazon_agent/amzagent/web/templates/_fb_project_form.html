<form method="post" action="{% if p %}/admin/fb/projects/{{ p.id }}{% else %}/admin/fb/projects{% endif %}" style="display:grid;gap:10px;margin-top:10px">
  <div class="set-grid">
    <label>Название<input name="name" required maxlength="80" value="{{ p.name if p else '' }}" placeholder="Витамин D — оффер X"></label>
    <label>Адрес лендинга<input name="lander_url" required value="{{ p.lander_url if p else '' }}" placeholder="https://ваш-лендинг.uz/"></label>
    <label>Страна<select name="country">{% for code, name in countries.items() %}<option value="{{ code }}"{% if (p.country if p else 'UZ') == code %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>
    <label>Язык объявлений<select name="language">{% for code, name in languages.items() %}<option value="{{ code }}"{% if (p.language if p else 'uz') == code %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>
    <label>Бюджет, $/день<input name="daily_budget" type="number" step="0.01" min="1" value="{{ '%.2f'|format(p.daily_budget) if p else '10.00' }}"></label>
    <label>Макс. цена лида, $<input name="max_cpl" type="number" step="0.01" min="0" value="{{ '%.2f'|format(p.max_cpl) if p else '0.00' }}"><span class="muted">дороже — агент будет отключать объявление (0 = не проверять)</span></label>
  </div>
  <label style="display:grid;gap:4px;font-weight:600">Товар и оффер<textarea name="product" rows="4" maxlength="3000" style="width:100%;box-sizing:border-box" placeholder="Что это, состав, для кого, цена для покупателя, доставка и оплата, что обещает производитель (без «лечит»)">{{ p.product if p else '' }}</textarea></label>
  <div><button class="primary">{{ "Сохранить проект" if p else "Создать проект" }}</button></div>
</form>
