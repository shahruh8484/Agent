<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Amazon агент</title>{% include "_style.html" %}
<link rel="icon" href="/admin-favicon.svg" type="image/svg+xml"></head>
<body><div class="wrap" style="max-width:360px;margin-top:12vh">
<div class="card">
  <h1>Amazon агент</h1>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
  <form method="post" action="/login" style="display:grid;gap:10px;margin-top:14px">
    <input name="username" placeholder="Логин" autocomplete="username" required>
    <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="primary" type="submit">Войти</button>
  </form>
</div></div></body></html>
