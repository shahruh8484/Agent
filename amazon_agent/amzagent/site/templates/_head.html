<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f5f0; --surface:#ffffff; --ink:#16181d; --muted:#5f636b; --line:#e7e3da;
  --accent:#e8590c; --accent-dark:#c2410c; --accent-soft:#fff1e6;
  --ok:#15803d; --warn:#b45309; --gold:#d97706; --hero1:#1f2937; --hero2:#3b2a1f;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,20,.04), 0 6px 20px rgba(20,20,20,.06);
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#121315; --surface:#1b1d21; --ink:#eceae6; --muted:#a4a7ad; --line:#2c2f35;
  --accent:#fb7a2e; --accent-dark:#f76707; --accent-soft:#2a1d14;
  --ok:#4ade80; --warn:#fbbf24; --gold:#fbbf24; --hero1:#0b0c0e; --hero2:#2a1c12;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
} }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
a { color:inherit; }
img { max-width:100%; }
.wrap { max-width:1120px; margin:0 auto; padding:0 16px; }

/* header */
.topbar { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.topbar .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; height:60px; }
.logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.08rem; text-decoration:none; letter-spacing:-.01em; }
.logo-mark { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:800; background:linear-gradient(135deg,var(--accent),#f59f00); }
.nav { display:flex; gap:18px; font-size:.92rem; color:var(--muted); }
.nav a { text-decoration:none; } .nav a:hover { color:var(--ink); }
.disclosure-bar { background:var(--accent-soft); color:var(--muted); font-size:.78rem; text-align:center; padding:6px 16px; }
.disclosure-bar a { color:var(--accent-dark); }

/* hero */
.hero { background:linear-gradient(135deg,var(--hero1),var(--hero2)); color:#fff; padding:44px 0 40px; }
.hero h1 { font-size:clamp(1.7rem,4vw,2.6rem); line-height:1.15; margin:0 0 10px; letter-spacing:-.02em; }
.hero p { margin:0; max-width:680px; color:rgba(255,255,255,.82); font-size:1.05rem; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
.chip { font-size:.8rem; padding:6px 12px; border-radius:99px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); }

main { padding:32px 0 56px; }
.section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 16px; }
.section-head h2 { margin:0; font-size:1.35rem; letter-spacing:-.01em; }
.section-head a { color:var(--accent-dark); font-weight:600; text-decoration:none; font-size:.95rem; }

/* cards */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
.card { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; display:flex; flex-direction:column; gap:10px; text-decoration:none; transition:transform .15s ease, box-shadow .15s ease; }
.card:hover { transform:translateY(-3px); box-shadow:0 2px 4px rgba(20,20,20,.05), 0 14px 32px rgba(20,20,20,.1); }
.card .media { height:200px; border-radius:10px; overflow:hidden; background:#fff; display:grid; place-items:center; }
.card .media img { width:100%; height:100%; object-fit:contain; }
.card .brand { font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.card h3 { margin:0; font-size:1rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card .summary { margin:0; color:var(--muted); font-size:.9rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .cta { margin-top:auto; font-weight:600; color:var(--accent-dark); font-size:.92rem; }
.rank { position:absolute; top:22px; left:22px; z-index:2; font-size:.75rem; font-weight:800; padding:4px 10px; border-radius:99px; background:var(--surface); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.12); }
.rank.top { background:linear-gradient(135deg,#f59f00,var(--accent)); color:#fff; }
.meta { color:var(--muted); font-size:.88rem; }

/* image placeholder when no Amazon photo may be shown */
.ph { width:100%; height:100%; min-height:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:14px;
      background:linear-gradient(135deg, hsl(var(--h,25) 80% 93%), hsl(calc(var(--h,25) + 30) 70% 82%)); color:hsl(var(--h,25) 45% 28%); border-radius:10px; }
.ph-initial { font-size:3rem; font-weight:800; line-height:1; opacity:.9; }
.ph-brand { font-size:.85rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }

/* buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff; padding:14px 26px; border-radius:12px; font-weight:700; font-size:1.02rem; text-decoration:none; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); transition:transform .15s ease, filter .15s ease; }
.btn:hover { transform:translateY(-1px); filter:brightness(1.05); }
.btn.block { width:100%; }

/* how we pick */
.how { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:40px; }
.how div { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
.how b { display:block; margin-bottom:4px; }
.how span { color:var(--muted); font-size:.92rem; }

footer { background:var(--hero1); color:rgba(255,255,255,.7); font-size:.85rem; padding:28px 0 36px; }
footer a { color:#fff; }
footer .brandline { color:#fff; font-weight:700; margin-bottom:6px; }
</style>
