services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/app/data
      - trading_data:/app/data/trading
    expose:
      - "8000"

  # EVEDEX trading bot (../cryptobot). Starts only with COMPOSE_PROFILES=trading
  # in .env; the panel's "Трейдинг" tab reads what it writes to trading_data.
  trader:
    profiles: ["trading"]
    build:
      context: ..
      dockerfile: cryptobot/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - trading_data:/data/trading

  # Deribit put seller (../cryptobot/options.py), same image. Starts only with "options"
  # in COMPOSE_PROFILES (e.g. COMPOSE_PROFILES=trading,options); shows on the Трейдинг tab too.
  options:
    profiles: ["options"]
    build:
      context: ..
      dockerfile: cryptobot/Dockerfile
    command: ["options"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - trading_data:/data/trading

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  app_data:
  trading_data:
