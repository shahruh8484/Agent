plugins {
    id "com.android.application"
}

// Подпись релиза: android/keystore.properties (не хранится в git) или переменные окружения.
def ks = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
def prop = { String k, String env -> ks.getProperty(k) ?: System.getenv(env) }

android {
    namespace "pro.familychef.app"
    compileSdk 36

    defaultConfig {
        applicationId "pro.familychef.app"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.0.3"

        // Сайт, который приложение открывает (адрес также задан в MainActivity.HOST).
        def host = "familychef.pro"
        resValue "string", "assetStatements",
            '[{ "relation": ["delegate_permission/common.handle_all_urls"], ' +
            '"target": {"namespace": "web", "site": "https://' + host + '"}}]'
    }

    signingConfigs {
        release {
            def store = prop("storeFile", "FC_KEYSTORE")
            if (store) {
                storeFile file(store)
                storePassword prop("storePassword", "FC_KEYSTORE_PASSWORD")
                keyAlias prop("keyAlias", "FC_KEY_ALIAS") ?: "upload"
                keyPassword prop("keyPassword", "FC_KEY_PASSWORD") ?: prop("storePassword", "FC_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Зеркало Maven для Robolectric (необязательно): ROBOLECTRIC_REPO=https://...
                def repo = System.getenv("ROBOLECTRIC_REPO")
                if (repo) {
                    systemProperty "robolectric.dependency.repo.url", repo
                    systemProperty "robolectric.dependency.repo.id", "mirror"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
}
