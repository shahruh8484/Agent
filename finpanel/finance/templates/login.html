<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Фин. панель</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1420; color: #e8eaf0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
  form { background: #161c2a; border: 1px solid #262e43; border-radius: 12px; padding: 26px; width: 100%; max-width: 340px; }
  h1 { font-size: 1.15rem; margin: 0 0 18px; }
  label { display: block; font-size: 0.8rem; color: #98a2b8; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 11px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #2c3550; background: #10141f; color: #e8eaf0; font-size: 0.95rem; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #4c6ef5; color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .error { background: #3a1a1f; color: #ffb3b3; padding: 8px 10px; border-radius: 7px; margin-bottom: 14px; font-size: 0.85rem; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Фин. панель</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label for="username">Логин</label>
  <input id="username" name="username" autocomplete="username" required>
  <label for="password">Пароль</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Войти</button>
</form>
</body>
</html>
